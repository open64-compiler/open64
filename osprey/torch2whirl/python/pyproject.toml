[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "open64-dsc"
version = "0.1.0"
description = "Python ingestion skeleton for the Open64 torch2whirl frontend"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["open64_dsc*"]
